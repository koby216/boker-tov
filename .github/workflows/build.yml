name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: boker-tov-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk boker-tov.apk
          # מוחקים טיוטות ישנות שנשארו
          gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft) | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}" || true
          # גרסה חדשה עם שם ייחודי בכל בנייה, והיא מסומנת כאחרונה
          gh release create "build-${{ github.run_number }}" boker-tov.apk \
            --title "גרסה ${{ github.run_number }}" \
            --notes "קובץ ההתקנה האחרון של בוקר טוב." \
            --target "${{ github.sha }}" \
            --latest
          # משאירים רק את 3 הגרסאות האחרונות
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true
