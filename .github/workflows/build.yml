name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: boker-tov-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish latest release (one fixed link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk boker-tov.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest boker-tov.apk \
            --title "הגרסה האחרונה" \
            --notes "קובץ ההתקנה האחרון של בוקר טוב. לוחצים על boker-tov.apk להורדה." \
            --target "${{ github.sha }}" \
            --latest
